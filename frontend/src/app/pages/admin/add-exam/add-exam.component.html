<mat-card style="padding: 30px;">
    <h1>Agregar Examen</h1>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <form (ngSubmit)="formSubmit()">
                <mat-form-field appearance="fill" class="w100">
                    <mat-label>Título</mat-label>
                    <input
                    required
                    autofocus
                    type="text"
                    name="title"
                    matInput
                    placeholder="Ingrese el título del examen"
                    [(ngModel)]="exam.title">
                </mat-form-field>
                <mat-form-field appearance="fill" class="w100">
                    <mat-label>Descripcion</mat-label>
                    <textarea
                    name="description"
                    matInput
                    placeholder="Ingrese la descripcion del examen"
                    rows="15"
                    [(ngModel)]="exam.description">
                    </textarea>
                </mat-form-field>
                <div class="row">
                    <div class="col-md-6">
                        <mat-form-field appearance="fill" class="w100">
                            <mat-label>Puntos Máximos</mat-label>
                            <input
                            type="text"
                            name="maximumPoints"
                            matInput
                            placeholder="Ingrese la cantidad de puntos"
                            [(ngModel)]="exam.maximumPoints">
                        </mat-form-field>
                    </div>
                    <div class="col-md-6">
                        <mat-form-field appearance="fill" class="w100">
                            <mat-label>Número de Preguntas</mat-label>
                            <input
                            type="text"
                            name="numberOfQuestions"
                            matInput
                            placeholder="Ingrese el numero de preguntas"
                            [(ngModel)]="exam.numberOfQuestions">
                        </mat-form-field>
                    </div>
                </div>
                <mat-slide-toggle class="mt20" [(ngModel)]="exam.stateDelete" color="primary">
                    Estado Publicacion
                </mat-slide-toggle>
                <mat-form-field appearance="fill" class="mt20 w100">
                    <mat-label>Categorías</mat-label>
                    <mat-select
                      name="category"
                      [(ngModel)]="exam.category.id">
                      <mat-option *ngFor="let c of categories" [value]="c.id">
                        {{ c.title }}
                      </mat-option>
                    </mat-select>
                </mat-form-field>
                <div class="container text-center">
                    <button mat-raised-button color="primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</mat-card>
