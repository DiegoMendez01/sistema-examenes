<mat-card>
    <mat-list>
        <div matSubheader>
            Todas las Categorías
        </div>
        <mat-list-item *ngFor="let c of categories">
            <div matListItemLine>{{ c.title }}</div>
            <div matListItemLine>{{ c.description }}</div>
            <mat-divider></mat-divider>
        </mat-list-item>
    </mat-list>
    <div class="container text-center mt20 mb20">
        <button mat-raised-button color="primary">Agregar Categoria</button>
    </div>
</mat-card>
