<mat-card>
    <mat-action-list>
        <div mat-subheader>
            Categorias Disponibles
        </div>
        <button
            mat-list-item
            [routerLink]="'/user/0'">
            <mat-icon>quiz</mat-icon> Examenes
        </button>
        <button
            mat-list-item
            [routerLink]="'/user/'+c.id"
            *ngFor="let c of categories">
            <mat-icon>account_circle</mat-icon> {{ c.title }}
        </button>
    </mat-action-list> 
 </mat-card>
